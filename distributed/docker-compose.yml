services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  flower:
    image: mher/flower:2.0
    command: celery --broker=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0 flower --port=5555
    ports: ["5555:5555"]
    depends_on: [redis]

  worker-on-main:
    build: .
    command: celery -A celery_app worker -l info --concurrency=2 -n main@%h
    environment:
      MAIN_IP: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    depends_on: [redis]

volumes:
  redis-data:

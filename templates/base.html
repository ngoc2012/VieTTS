<!DOCTYPE html>
<html lang="{% block lang %}vi{% endblock %}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}VieNeu-TTS{% endblock %}</title>
    <link rel="stylesheet" href="/static/theme.css">
    {% block head %}{% endblock %}
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>

<body>

    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/">
                <img class="brand-logo" src="/static/jl-logo.svg" alt="JL" height="32">
            </a>
            <nav>
                <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Studio</a>
                <a href="/yt" {% if request.path.startswith('/yt') %}class="active"{% endif %}>YouTube</a>
                <a href="/read" {% if request.path.startswith('/read') or request.path.startswith('/viewer') %}class="active"{% endif %}>PDF Reader</a>
            </nav>
            <div class="topbar-account">
                <button class="theme-toggle" id="btn-theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
                {% if nav_account %}
                <a class="balance-chip" href="/account" title="Balance — top up">{{ nav_balance }}</a>
                <a class="account-name" href="/profile">{{ nav_account.username }}</a>
                {% else %}
                <a class="nav-link" href="/login">Sign in</a>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="page {% block page_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <script>
        (function () {
            var btn = document.getElementById('btn-theme-toggle');
            function sync() {
                var dark = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.textContent = dark ? '☀️' : '🌙';
            }
            btn.addEventListener('click', function () {
                var dark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (dark) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                }
                sync();
            });
            sync();
        })();
    </script>

    {% block scripts %}{% endblock %}

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - VieNeu-TTS</title>
    <link rel="stylesheet" href="/static/billing.css">
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>VieNeu-TTS Account</h1>
            <p class="muted">New accounts start with a 10.00 € welcome credit.</p>
        </div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div class="card">
            <h2>Sign in</h2>
            <form method="post" action="/login">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <button class="btn" type="submit" name="action" value="login">Sign in</button>
                <button class="btn btn-secondary" type="submit" name="action" value="register">Create account</button>
            </form>
        </div>

        <p class="muted"><a class="nav-link" href="/">← Back to app</a></p>
    </div>

</body>

</html>

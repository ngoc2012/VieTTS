{% extends "base.html" %}

{% block lang %}en{% endblock %}
{% block title %}Sign in - VieNeu-TTS{% endblock %}
{% block page_class %}page-slim{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Sign in</h1>
    <p>New accounts start with a 10.00 € welcome credit.</p>
</div>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<div class="card">
    <form method="post" action="/login">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <div class="login-actions">
            <button class="btn" type="submit" name="action" value="login">Sign in</button>
            <button class="btn btn-secondary" type="submit" name="action" value="register">Create account</button>
        </div>
    </form>
</div>

{% endblock %}

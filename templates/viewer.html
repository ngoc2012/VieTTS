<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ display_name }} - PDF Viewer & OCR</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .viewer-header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .title {
            font-weight: 700;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .viewer-main {
            display: flex;
            flex: 1;
            height: calc(100vh - 70px);
            overflow: hidden;
        }

        .column {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            scrollbar-width: thin;
        }

        .column-image {
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid var(--glass-border);
        }

        .column-text {
            background: rgba(255, 255, 255, 0.02);
        }

        .page-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #fff;
            /* Paper background for contrast */
        }

        .ocr-container {
            width: 100%;
            max-width: 800px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 2rem;
            line-height: 1.6;
            font-size: 1.1rem;
            white-space: pre-wrap;
            position: relative;
            min-height: 400px;
        }

        .btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--neon-blue);
        }

        .btn-nav {
            font-weight: 700;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        #page-num-display {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-weight: 600;
        }

        .loader {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--neon-blue);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status-msg {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>

    <div class="viewer-header">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <a href="/read" class="btn">← Back</a>
            <div class="title">{{ display_name }}</div>
        </div>

        <div class="controls">
            <button class="btn btn-nav" id="prev-btn" onclick="changePage(-1)">‹</button>
            <span id="page-num-display">Page 1 / {{ page_count }}</span>
            <button class="btn btn-nav" id="next-btn" onclick="changePage(1)">›</button>
        </div>

        <div style="display: flex; gap: 0.5rem;">
            <button class="btn" style="border-color: var(--neon-purple);" onclick="copyText()">Copy Text</button>
        </div>
    </div>

    <div class="viewer-main">
        <div class="column column-image">
            <img id="page-image" src="/static/uploads/images/{{ pdf_id }}/page_1.png" class="page-image"
                alt="Page Image">
        </div>
        <div class="column column-text">
            <div class="status-msg" id="ocr-status">OCR status: Ready</div>
            <div class="ocr-container" id="ocr-container">
                <div class="loader" id="loader"></div>
                <div id="ocr-text">Loading text...</div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = {{ page_count }};
        const pdfId = "{{ pdf_id }}";

        const imgElement = document.getElementById('page-image');
        const textElement = document.getElementById('ocr-text');
        const pageDisplay = document.getElementById('page-num-display');
        const loader = document.getElementById('loader');
        const ocrStatus = document.getElementById('ocr-status');

        async function loadPage(page) {
            if (page < 1 || page > totalPages) return;

            currentPage = page;
            pageDisplay.textContent = `Page ${currentPage} / ${totalPages}`;

            // Update image
            imgElement.src = `/static/uploads/images/${pdfId}/page_${currentPage}.png`;

            // Update text
            textElement.textContent = '';
            loader.style.display = 'block';
            ocrStatus.textContent = 'OCR status: Extracting...';

            try {
                const response = await fetch(`/api/ocr/${pdfId}/${currentPage}`);
                const data = await response.json();

                if (data.ok) {
                    textElement.textContent = data.text;
                    ocrStatus.textContent = 'OCR status: Success';
                } else {
                    textElement.textContent = 'Error: ' + data.error;
                    ocrStatus.textContent = 'OCR status: Error';
                }
            } catch (err) {
                textElement.textContent = 'Failed to connect to server.';
                ocrStatus.textContent = 'OCR status: Network error';
            } finally {
                loader.style.display = 'none';
            }
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                loadPage(newPage);
            }
        }

        function copyText() {
            const text = textElement.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const originalText = ocrStatus.textContent;
                ocrStatus.textContent = 'OCR status: Text copied to clipboard!';
                setTimeout(() => ocrStatus.textContent = originalText, 2000);
            });
        }

        // Initial load
        loadPage(1);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changePage(-1);
            if (e.key === 'ArrowRight') changePage(1);
        });
    </script>

</body>

</html>

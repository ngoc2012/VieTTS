<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ display_name }} - PDF Viewer & OCR</title>
    <link rel="stylesheet" href="/static/viewer.css">
</head>

<body>

    <div class="viewer-header">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <a href="/read" class="btn">← Back</a>
            <div class="title">{{ display_name }}</div>
        </div>

        <div class="controls">
            <button class="btn btn-nav" id="prev-btn" onclick="changePage(-1)">‹</button>
            <span id="page-num-display">Page 1 / {{ page_count }}</span>
            <button class="btn btn-nav" id="next-btn" onclick="changePage(1)">›</button>
        </div>

        <div style="display: flex; gap: 0.5rem;">
            <button class="btn" id="toggle-btn" style="border-color: var(--neon-blue);" onclick="toggleView()">Show OCR</button>
            <button class="btn" style="border-color: var(--neon-purple);" onclick="copyText()">Copy Text</button>
        </div>
    </div>

    <div class="viewer-main">
        <div class="column column-image" style="display: flex;">
            <img id="page-image" src="/static/uploads/images/{{ pdf_id }}/page_{{ start_page }}.png" class="page-image"
                alt="Page Image">
        </div>
        <div class="column column-text" style="display: none;">
            <div class="ocr-container" id="ocr-container">
                <div id="ocr-text">Loading text...</div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = {{ start_page }};
        const totalPages = {{ page_count }};
        const pdfId = "{{ pdf_id }}";

        const imgElement = document.getElementById('page-image');
        const textElement = document.getElementById('ocr-text');
        const pageDisplay = document.getElementById('page-num-display');
        const toggleBtn = document.getElementById('toggle-btn');
        const imageCol = document.querySelector('.column-image');
        const textCol = document.querySelector('.column-text');

        let currentElements = [];
        let pageDimensions = { width: 612, height: 792 }; // Default letter size
        let showImage = true; // Start with image view

        async function getPageDimensions(pdf, page) {
            try {
                const response = await fetch(`/api/ocr/${pdf}/${page}/dimensions`);
                const data = await response.json();
                if (data.width && data.height) {
                    pageDimensions = { width: data.width, height: data.height };
                }
            } catch (err) {
                console.warn('Failed to get page dimensions:', err);
            }
        }

        async function getTranslatedElements(pdf, page) {
            // Get OCR data
            const ocrResponse = await fetch(`/api/ocr/${pdf}/${page}`);
            const ocrData = await ocrResponse.json();

            if (!ocrData.ok) {
                throw new Error(ocrData.error || 'Failed to get OCR');
            }

            let elements = ocrData.elements || [];

            // Poll for translations if pending
            if (ocrData.translation_status === 'pending') {
                let maxRetries = 120; // 60 seconds at 500ms poll
                let translationsReady = false;

                while (maxRetries > 0 && !translationsReady) {
                    // Check translation status
                    const statusResponse = await fetch(`/api/ocr/${pdf}/${page}/status`);
                    const statusData = await statusResponse.json();

                    if (statusData.status === 'done') {
                        elements = statusData.elements || elements;
                        translationsReady = true;
                        break;
                    } else if (statusData.status === 'error') {
                        console.warn('Translation error:', statusData.error);
                        // Use elements without translations
                        break;
                    }

                    // Wait before polling again
                    await new Promise(resolve => setTimeout(resolve, 500));
                    maxRetries--;
                }

                if (!translationsReady && maxRetries === 0) {
                    console.warn('Translation timeout, using available text');
                }
            }

            return elements;
        }

        function pointInBbox(x, y, bbox) {
            // bbox = [x1, y1, x2, y2]
            return x >= bbox[0] && x <= bbox[2] && y >= bbox[1] && y <= bbox[3];
        }

        function getElementsAtPoint(pdfX, pdfY) {
            return currentElements.filter(el => {
                if (!el['bounding box']) return false;
                return pointInBbox(pdfX, pdfY, el['bounding box']);
            });
        }

        function clearHighlights() {
            document.querySelectorAll('.element-highlight').forEach(el => {
                el.classList.remove('element-highlight');
            });
        }

        function highlightElements(elements) {
            clearHighlights();
            if (!elements.length) return;

            const elementIds = new Set(elements.map(e => e.id));
            document.querySelectorAll('[data-element-id]').forEach(el => {
                const id = parseInt(el.getAttribute('data-element-id'));
                if (elementIds.has(id)) {
                    el.classList.add('element-highlight');
                }
            });
        }

        imgElement.addEventListener('mousemove', (e) => {
            if (!currentElements.length) return;

            const imgRect = imgElement.getBoundingClientRect();
            const imgX = e.clientX - imgRect.left;
            const imgY = e.clientY - imgRect.top;

            // Map from display coordinates to PDF coordinates
            // Image uses object-fit: contain, so account for actual displayed dimensions
            const displayWidth = imgRect.width;
            const displayHeight = imgRect.height;

            // Normalize to 0-1 range, then scale to PDF dimensions
            // PDF Y inverted: screen top (Y=0) maps to PDF bottom (Y=0), screen bottom maps to PDF top (Y=height)
            const pdfX = (imgX / displayWidth) * pageDimensions.width;
            const pdfY = pageDimensions.height - ((imgY / displayHeight) * pageDimensions.height);

            const hoveredElements = getElementsAtPoint(pdfX, pdfY);
            highlightElements(hoveredElements);
        });

        imgElement.addEventListener('mouseleave', clearHighlights);

        function toggleView() {
            showImage = !showImage;
            imageCol.style.display = showImage ? 'flex' : 'none';
            textCol.style.display = showImage ? 'none' : 'flex';
            toggleBtn.textContent = showImage ? 'Show OCR' : 'Show Image';
        }

        async function loadPage(page) {
            if (page < 1 || page > totalPages) return;

            currentPage = page;
            pageDisplay.textContent = `Page ${currentPage} / ${totalPages}`;
            history.replaceState(null, '', `/viewer/${pdfId}/${currentPage}`);

            // Update image
            imgElement.src = `/static/uploads/images/${pdfId}/page_${currentPage}.png`;

            // Clear text
            textElement.textContent = 'Loading...';
            clearHighlights();

            try {
                // Get page dimensions
                await getPageDimensions(pdfId, currentPage);

                let displayText = '';
                let prevElements = [];

                // Check previous page for incomplete sentence
                if (currentPage > 1) {
                    try {
                        prevElements = await getTranslatedElements(pdfId, currentPage - 1);
                        if (prevElements && prevElements.length > 0) {
                            const lastElement = prevElements[prevElements.length - 1];
                            const lastText = lastElement.translation || lastElement.content || '';

                            // If doesn't end with period, prepend to current page
                            if (lastText.trim() && !lastText.trim().endsWith('.')) {
                                displayText = lastText + '\n\n';
                            }
                        }
                    } catch (err) {
                        // Silently ignore previous page errors
                    }
                }

                // Get current page with translations
                const elements = await getTranslatedElements(pdfId, currentPage);
                currentElements = elements;

                // Build HTML with data-element-id for highlighting
                const textParts = elements
                    .map(e => {
                        const text = e.translation || e.content || '';
                        if (!text.trim()) return '';
                        return `<span data-element-id="${e.id}">${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>`;
                    })
                    .filter(t => t.trim());

                displayText += textParts.join('\n');

                if (!displayText) {
                    textElement.textContent = '(No text found)';
                    return;
                }

                textElement.innerHTML = displayText;
            } catch (err) {
                textElement.textContent = 'Failed to load text: ' + err.message;
            }
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                loadPage(newPage);
            }
        }

        function copyText() {
            const text = textElement.textContent;
            navigator.clipboard.writeText(text);
        }

        // Initial load
        loadPage(currentPage);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changePage(-1);
            if (e.key === 'ArrowRight') changePage(1);
        });
    </script>

</body>

</html>
